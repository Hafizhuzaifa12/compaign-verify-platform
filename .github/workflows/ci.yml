name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - "copilot/**"
      - "integration/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Run backend tests (allow no-tests repos)
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

  ai-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-ml-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app training

  blockchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain-infra/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
