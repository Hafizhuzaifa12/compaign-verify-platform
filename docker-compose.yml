services:
  db:
    image: postgres:16-alpine
    container_name: cvp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campaign_verify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaign_verify"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-ml-module
      dockerfile: Dockerfile
    container_name: cvp-ai
    environment:
      API_PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  blockchain-service:
    build:
      context: ./blockchain-infra
      dockerfile: Dockerfile
    container_name: cvp-blockchain
    environment:
      BLOCKCHAIN_NETWORK: simulated-local
      LEDGER_FILE: /data/ledger.json
      TX_SALT: local-dev-salt
    ports:
      - "8002:8002"
    volumes:
      - blockchain-ledger:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: cvp-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/campaign_verify
      SECRET_KEY: dev-secret-change-me
      AI_PREDICT_URL: http://ai-service:8001/predict
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8002/v1
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      blockchain-service:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: cvp-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  blockchain-ledger:
  backend-uploads:
